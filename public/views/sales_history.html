<div class="row g-4 mb-4" id="rowSectionSalesHistory">
    <div class="col-lg-12">
        <div id="incomeCard" class="card p-4 shadow-sm bg-white border-start border-success border-4">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <h5 class="text-success fw-bold fs-6 m-0 d-flex align-items-center gap-2">
                    <i class="bi bi-cash-coin"></i> ប្រវត្តិការលក់ចេញសរុប (Sales Transactions History)
                </h5>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-sm btn-outline-primary fw-bold px-3 py-1" onclick="printSalesHistorySection()">🖨 បោះពុម្ព (Print)</button>
                    <button type="button" class="btn btn-sm btn-danger fw-bold px-3 py-1" onclick="downloadPDFSalesHistory()">📥 រក្សាទុក PDF (Save PDF)</button>
                </div>
            </div>

            <div id="printableSalesHistoryArea">
                <div class="text-center mb-3 d-none print-sales-header">
                    <h4 class="fw-bold text-dark">ប្រវត្តិការលក់ចេញសរុប (Sales Transactions History)</h4>
                    <p class="small text-muted">កាលបរិច្ឆេទ: ទូទាំងប្រវត្តិ</p>
                </div>
                <div class="table-responsive" style="max-height: 350px; overflow-y: auto;">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-success sticky-top">
                            <tr>
                                <th>កាលបរិច្ឆេទ (Date)</th>
                                <th>អ្នកលក់ (Staff/User)</th>
                                <th>Category</th>
                                <th>ទំនិញ (Item)</th>
                                <th>ចំនួនលក់ (Qty)</th>
                                <th>តម្លៃលក់ (Price)</th>
                                <th>សរុប ($ Total)</th>
                                <th class="text-center">សកម្មភាព (Actions)</th>
                            </tr>
                        </thead>
                        <tbody id="incomeTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
