<div class="row g-4 mb-4">
    <div class="col-lg-4" id="colMasterForm">
        <div id="adminMasterCard" class="card p-4 shadow-sm bg-white h-100">
            <h5 class="mb-3 text-dark fw-bold fs-6 border-bottom pb-2 d-flex align-items-center gap-2">
                <i class="bi bi-gear-fill text-primary"></i> បង្កើតមុខទំនិញ និងកំណត់តម្លៃ (Master Items)
            </h5>
            <form id="masterForm">
                <div class="mb-3">
                    <label class="form-label small text-muted fw-bold">Category (ក្រុមទំនិញ)</label>
                    <input type="text" class="form-control form-control-sm" id="masterCategory" placeholder="ឧ. ភេសជ្ជៈ, ស្រាបៀរ..." required>
                </div>
                <div class="mb-3">
                    <label class="form-label small text-muted fw-bold">ឈ្មោះទំនិញ (Item Name)</label>
                    <input type="text" class="form-control form-control-sm" id="masterItemName" placeholder="ឧ. កូកាកូឡា, ទីហ្គឺរ..." required>
                </div>
                <div class="mb-3">
                    <label class="form-label small text-muted fw-bold">រូបភាពទំនិញ (Image File)</label>
                    <input type="file" class="form-control form-control-sm" id="masterImageFile" accept="image/png, image/jpeg, image/jpg, image/webp">
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label small text-muted fw-bold">ឯកតា (Unit)</label>
                        <select class="form-select form-select-sm" id="masterUnit" required>
                            <option value="ដប">ដប</option>
                            <option value="កំប៉ុង">កំប៉ុង</option>
                            <option value="កេស">កេស</option>
                            <option value="ដុំ">ដុំ</option>
                        </select>
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label small text-muted fw-bold">ស្តុកដំបូង (Initial Qty)</label>
                        <input type="number" class="form-control form-control-sm" id="masterStock" value="0" min="0" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label small text-muted fw-bold">តម្លៃដើម ($ Cost)</label>
                        <input type="number" step="0.01" class="form-control form-control-sm" id="masterCostPrice" placeholder="0.00" required>
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label small text-muted fw-bold">តម្លៃលក់រាយ ($ Retail)</label>
                        <input type="number" step="0.01" class="form-control form-control-sm" id="masterRetailPrice" placeholder="0.00" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label small text-muted fw-bold">តម្លៃលក់ដុំ ($ Wholesale)</label>
                    <input type="number" step="0.01" class="form-control form-control-sm" id="masterWholesalePrice" placeholder="0.00" required>
                </div>
                <button type="submit" class="btn btn-dark btn-sm w-100 shadow-sm py-2">
                    <i class="bi bi-plus-circle me-1"></i> រក្សាទុកទំនិញចូលបញ្ជី (Save Item)
                </button>
            </form>
        </div>
    </div>
    
    <div class="col-lg-8" id="colAdminMasterListContainer">
        <div id="adminMasterListCard" class="card p-4 shadow-sm bg-white h-100">
            <h5 class="text-secondary fw-bold fs-6 mb-3 d-flex align-items-center gap-2">
                <i class="bi bi-archive-fill"></i> បញ្ជីស្តុកទំនិញក្នុងឃ្លាំង (Master & Stock List)
            </h5>
            <div class="table-responsive" style="max-height: 480px; overflow-y: auto;">
                <table class="table table-sm table-hover align-middle mb-0">
                    <thead class="table-light sticky-top">
                        <tr>
                            <th>Category</th>
                            <th>ឈ្មោះទំនិញ (Item)</th>
                            <th>ឯកតា (Unit)</th>
                            <th>ស្តុកសល់ (Stock)</th>
                            <th>តម្លៃដើម ($ Cost)</th>
                            <th>លក់រាយ ($ Retail)</th>
                            <th>លក់ដុំ ($ Wholesale)</th>
                            <th class="text-center admin-action-col">សកម្មភាព (Actions)</th>
                        </tr>
                    </thead>
                    <tbody id="masterTableBodyAdmin"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
