<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគ្រប់គ្រងការលក់ និងស្តុក (POS & Inventory System)</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts: Kantumruy Pro & Battambang -->
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- html2pdf for Save PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg-body: #f8fafc;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --primary-color: #4f46e5;
            --success-color: #10b981;
            --danger-color: #ef4444;
        }
        body { 
            background-color: var(--bg-body); 
            font-family: 'Kantumruy Pro', 'Battambang', sans-serif; 
            color: #1e293b;
            letter-spacing: -0.01em;
        }
        h1, h2, h3, h4, h5, h6, .card-title, label, th, .btn { 
            font-family: 'Kantumruy Pro', 'Battambang', sans-serif; 
        }
        .card { 
            border-radius: 18px; 
            border: 1px solid #e2e8f0; 
            box-shadow: var(--card-shadow);
            background: #ffffff;
            transition: all 0.2s ease;
        }
        .card-summary { 
            border-radius: 18px; 
            color: white; 
            border: none; 
        }
        .form-control, .form-select {
            border-radius: 12px;
            padding: 0.6rem 1rem;
            border-color: #cbd5e1;
            font-size: 14px;
        }
        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
            border-color: var(--primary-color);
        }
        .btn {
            border-radius: 12px;
            padding: 0.6rem 1.2rem;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn:hover {
            transform: translateY(-1px);
        }
        /* ទប់ស្កាត់មិនឱ្យចេញផ្ទាំងត្រួតគ្នាពេលទើបបើក */
        #appContainer, #loginContainer {
            display: none;
        }
        .pos-item-card {
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .pos-item-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -5px rgba(0,0,0,0.1);
            border-color: var(--success-color) !important;
        }
        .table th {
            font-weight: 600;
            color: #475569;
            background-color: #f8fafc !important;
            border-bottom: 2px solid #e2e8f0;
        }
    </style>
</head>
<body class="py-4">

    <!-- LOGIN CONTAINER -->
    <div id="loginContainer" class="container mt-5" style="max-width: 440px;">
        <div class="card p-5 shadow-lg bg-white border-0">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px; font-size: 24px;">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <h3 class="fw-bold text-dark fs-4">🔐 ចូលប្រើប្រាស់ប្រព័ន្ធ</h3>
                <p class="text-muted small">System Login & Security Authentication</p>
            </div>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label small text-muted fw-bold">ឈ្មោះអ្នកប្រើប្រាស់ (Username)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control border-start-0" id="loginUsername" placeholder="បញ្ចូលឈ្មោះ..." required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label small text-muted fw-bold">ពាក្យសម្ងាត់ (Password)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control border-start-0" id="loginPassword" placeholder="បញ្ចូលពាក្យសម្ងាត់..." required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm fw-bold">ចូលគណនី (Login)</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP CONTAINER (DASHBOARD MENU) -->
    <div id="appContainer" class="container-fluid px-4" style="max-width: 1450px;">
        <!-- Top Navigation Header -->
        <div class="d-flex align-items-center justify-content-between mb-4 bg-white p-3 px-4 rounded-4 shadow-sm border flex-wrap gap-3">
            <div class="d-flex align-items-center gap-2">
                <div class="bg-primary text-white p-2 rounded-3 fs-5 d-flex align-items-center justify-content-center" style="width: 42px; height: 42px;">
                    <i class="bi bi-shop"></i>
                </div>
                <div>
                    <h2 class="text-dark fw-bold m-0 fs-5">ប្រព័ន្ធគ្រប់គ្រងការលក់ និងស្តុក</h2>
                    <span class="text-muted" style="font-size: 12px;">POS & Inventory Management System</span>
                </div>
            </div>
            <div class="d-flex align-items-center flex-wrap gap-2">
                <!-- Dashboard Menu Navigation Buttons -->
                <button class="btn btn-outline-dark btn-sm px-3 shadow-sm fw-semibold" onclick="loadView('pos')">
                    <i class="bi bi-cart-check me-1"></i> ទំព័រលក់ (POS)
                </button>
                <button class="btn btn-outline-dark btn-sm px-3 shadow-sm fw-semibold" onclick="loadView('inventory')">
                    <i class="bi bi-archive me-1"></i> ស្តុកទំនិញ
                </button>
                <button class="btn btn-outline-dark btn-sm px-3 shadow-sm fw-semibold" onclick="loadView('sales_history')">
                    <i class="bi bi-cash-coin me-1"></i> ប្រវត្តិលក់
                </button>
                <button class="btn btn-outline-dark btn-sm px-3 shadow-sm fw-semibold" onclick="loadView('restock')">
                    <i class="bi bi-box-arrow-in-down me-1"></i> ទិញស្តុក
                </button>
                <button class="btn btn-outline-dark btn-sm px-3 shadow-sm fw-semibold" onclick="loadView('staff')">
                    <i class="bi bi-person-plus me-1"></i> បុគ្គលិក
                </button>

                <div class="vr mx-1"></div>

                <button id="adminActivityLogBtn" onclick="openActivityLogModal()" class="btn btn-outline-primary btn-sm px-3 shadow-sm fw-semibold">
                    <i class="bi bi-clock-history me-1"></i> សកម្មភាព
                </button>
                <button id="adminInvoiceHistoryBtn" onclick="openInvoiceHistoryModal()" class="btn btn-outline-secondary btn-sm px-3 shadow-sm fw-semibold">
                    <i class="bi bi-receipt me-1"></i> វិក្កយបត្រ
                </button>
                <button id="adminReceivableBtn" onclick="openDebtReportModal()" class="btn btn-outline-warning btn-sm px-3 shadow-sm fw-semibold text-dark">
                    <i class="bi bi-journal-text me-1"></i> ជំពាក់(អតិថិជន)
                </button>
                <button id="adminPayableBtn" onclick="openPayableReportModal()" class="btn btn-outline-danger btn-sm px-3 shadow-sm fw-semibold">
                    <i class="bi bi-journal-bookmark me-1"></i> ជំពាក់(គេ)
                </button>
                <button id="adminReportBtn" onclick="openReportModal()" class="btn btn-primary btn-sm px-3 shadow-sm fw-semibold">
                    <i class="bi bi-graph-up-arrow me-1"></i> របាយការណ៍
                </button>
                <div class="vr mx-1"></div>
                <span id="welcomeUser" class="fw-semibold text-secondary px-2 py-1 bg-light rounded-3" style="font-size: 13px;"></span>
                <button onclick="logout()" class="btn btn-outline-danger btn-sm px-3">
                    <i class="bi bi-box-arrow-right me-1"></i> ចេញ
                </button>
            </div>
        </div>

        <!-- CARDS SUMMARY -->
        <div id="adminSummaryCards" class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card bg-success card-summary p-4 shadow-sm position-relative overflow-hidden">
                    <div class="position-absolute end-0 top-0 p-3 text-white-50 opacity-25" style="font-size: 3.5rem;"><i class="bi bi-cash-stack"></i></div>
                    <h6 class="text-white-50 mb-1 fw-semibold small">ប្រាក់ចំណូលសរុប (Total Sales Income)</h6>
                    <h3 id="lblTotalIncome" class="fw-bold m-0">$0.00</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-secondary card-summary p-4 shadow-sm position-relative overflow-hidden">
                    <div class="position-absolute end-0 top-0 p-3 text-white-50 opacity-25" style="font-size: 3.5rem;"><i class="bi bi-box-seam"></i></div>
                    <h6 class="text-white-50 mb-1 fw-semibold small">ទំហំទិញស្តុកសរុប (Total Inventory Value)</h6>
                    <h3 id="lblTotalExpense" class="fw-bold m-0">$0.00</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-primary card-summary p-4 shadow-sm position-relative overflow-hidden">
                    <div class="position-absolute end-0 top-0 p-3 text-white-50 opacity-25" style="font-size: 3.5rem;"><i class="bi bi-graph-up"></i></div>
                    <h6 class="text-white-50 mb-1 fw-semibold small">ប្រាក់ចំណេញសុទ្ធពីការលក់ (Net Profit)</h6>
                    <h3 id="lblNetProfit" class="fw-bold m-0">$0.00</h3>
                </div>
            </div>
        </div>

        <!-- DYNAMIC CONTENT AREA (កន្លែង Load ឯកសារ HTML រងពី views/ មកបង្ហាញ) -->
        <div id="dynamicContentArea"></div>
    </div>

    <!-- Modals ទាំងអស់ (រក្សាទុកក្នុង index.html ដើមដដែល) -->
    <!-- (Activity Log Modal, Report Modal, Debt Report Modal, Payable Modal, Invoice History Modal, etc.) -->

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript សម្រាប់ Dashboard និង View Switcher -->
    <script>
        const API_BASE = window.location.origin;
        const API_URL = `${API_BASE}/api/accounting`;
        
        let masterItemsList = [];
        let allTransactionsList = [];
        let allInvoicesList = [];
        let currentCart = [];
        
        // Modal references
        let editMasterModal, editCartModal, reportModal, invoiceHistoryModal;
        let editInvoiceModal, editTransactionModal, activityLogModal, debtReportModal, payableReportModal, payDebtModal;

        document.addEventListener("DOMContentLoaded", () => {
            // Initialize Modals
            editMasterModal = new bootstrap.Modal(document.getElementById('editMasterModal'));
            editCartModal = new bootstrap.Modal(document.getElementById('editCartModal'));
            reportModal = new bootstrap.Modal(document.getElementById('reportModal'));
            invoiceHistoryModal = new bootstrap.Modal(document.getElementById('invoiceHistoryModal'));
            editInvoiceModal = new bootstrap.Modal(document.getElementById('editInvoiceModal'));
            editTransactionModal = new bootstrap.Modal(document.getElementById('editTransactionModal'));
            activityLogModal = new bootstrap.Modal(document.getElementById('activityLogModal'));
            debtReportModal = new bootstrap.Modal(document.getElementById('debtReportModal'));
            payableReportModal = new bootstrap.Modal(document.getElementById('payableReportModal'));
            payDebtModal = new bootstrap.Modal(document.getElementById('payDebtModal'));
            
            checkLoginState();
        });

        // មុខងារប្តូរ View តាម Menu ដោយមិនបាត់បង់ទម្រង់ដើម
        async function loadView(viewName) {
            try {
                let res = await fetch(`./views/${viewName}.html`);
                if (res.ok) {
                    let html = await res.text();
                    document.getElementById('dynamicContentArea').innerHTML = html;
                    
                    // ហៅមុខងារទិន្នន័យឡើងវិញតាមទំព័រនីមួយៗ
                    if (viewName === 'pos') { renderPosImageGrid(); renderCartTable(); }
                    if (viewName === 'inventory') { renderMasterTable(); }
                    if (viewName === 'sales_history') { fetchTransactions(); }
                    if (viewName === 'restock') { filterRestockItemsByCategory(); }
                } else {
                    document.getElementById('dynamicContentArea').innerHTML = `<p class="text-danger text-center py-4">រកមិនឃើញទំព័រនេះទេ!</p>`;
                }
            } catch (err) {
                console.error("Error loading view:", err);
            }
        }

        // មុខងារពិនិត្យស្ថានភាព Login
        function checkLoginState() {
            let loggedUserStr = sessionStorage.getItem("loggedUserObj");
            if (loggedUserStr) {
                let userObj = JSON.parse(loggedUserStr);
                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('appContainer').style.display = 'block';
                document.getElementById('welcomeUser').innerText = `👤 ${userObj.username} (${(userObj.role || '').toUpperCase()})`;

                // Load ទំព័រ POS ចូលមកមុនគេជាំនាក់ដំបូង
                loadView('pos');
                loadAppData();
            } else {
                document.getElementById('loginContainer').style.display = 'block';
                document.getElementById('appContainer').style.display = 'none';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            let u = document.getElementById('loginUsername').value.trim();
            let p = document.getElementById('loginPassword').value.trim();

            try {
                let res = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                let data = await res.json();
                if (res.ok) {
                    sessionStorage.setItem("loggedUserObj", JSON.stringify(data.user));
                    checkLoginState();
                } else {
                    alert(`❌ ${data.error || 'ឈ្មោះអ្នកប្រើប្រាស់ ឬពាក្យសម្ងាត់មិនត្រឹមត្រូវ!'}`);
                }
            } catch (err) {
                console.error("Login error:", err);
                alert("❌ មានបញ្ហាក្នុងការភ្ជាប់ទៅកាន់ Server!");
            }
        });

        function logout() {
            sessionStorage.removeItem("loggedUserObj");
            checkLoginState();
        }

        async function loadAppData() {
            try {
                let resInv = await fetch(`${API_URL}/invoices`);
                let resMaster = await fetch(`${API_URL}/master-items`);
                let resTx = await fetch(`${API_URL}/transactions`);
                
                let invData = await resInv.json();
                let masterData = await resMaster.json();
                let txData = await resTx.json();

                if (invData.success) allInvoicesList = invData.data;
                if (masterData.success) masterItemsList = masterData.data;
                if (txData.success) allTransactionsList = txData.data;
            } catch (err) {
                console.error("Error loading app data:", err);
            }
        }
    </script>
</body>
</html>
