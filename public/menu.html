<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ម៉ឺនុយទំនិញ - Digital Menu</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts: Kantumruy Pro -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            background-color: #f8fafc;
            padding-bottom: 90px;
        }
        .header-bar {
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            color: white;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        .item-card {
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            background: #ffffff;
            transition: transform 0.2s;
        }
        .item-card img {
            height: 120px;
            object-fit: contain;
            background-color: #f8fafc;
        }
        .bottom-cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
            padding: 12px 20px;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header-bar p-3 shadow-sm mb-3">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h5 class="fw-bold m-0"><i class="bi bi-shop me-2"></i> menu ម្ហូប និងភេសជ្ជៈ</h5>
                <small class="text-white-50" id="tableNameDisplay">តុ/បន្ទប់: កំពុងស្វែងរក...</small>
            </div>
            <span class="badge bg-white text-primary fw-bold fs-6 shadow-sm" id="tableBadge">...</span>
        </div>
    </div>

    <div class="container">
        <!-- Filter Category -->
        <div class="mb-3">
            <select class="form-select form-select-sm fw-bold border-primary" id="categorySelect" onchange="renderMenuItems()">
                <option value="">-- គ្រប់ Category ទាំងអស់ --</option>
            </select>
        </div>

        <!-- Menu Grid -->
        <div class="row g-3" id="menuGrid">
            <p class="text-center text-muted py-4">កំពុងទាញយកបញ្ជីទំនិញ...</p>
        </div>
    </div>

    <!-- Bottom Cart Floating Bar -->
    <div class="bottom-cart-bar d-flex justify-content-between align-items-center">
        <div>
            <span class="text-muted small d-block">ទឹកប្រាក់សរុប</span>
            <h5 class="fw-bold text-success m-0" id="cartTotalDisplay">$0.00</h5>
        </div>
        <button class="btn btn-success fw-bold px-4 rounded-3 shadow-sm" onclick="openOrderModal()">
            <i class="bi bi-cart-check-fill me-1"></i> កុម្ម៉ង់ឥឡូវនេះ (<span id="cartCountDisplay">0</span>)
        </button>
    </div>

    <!-- Order Review Modal -->
    <div class="modal fade" id="orderModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow-lg">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title fw-bold fs-6"><i class="bi bi-receipt me-2"></i> បញ្ជាក់ការកុម្ម៉ង់ទំនិញ (Confirm Order)</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-3">
                    <p class="small text-muted mb-2">តុ/បន្ទប់: <b class="text-dark" id="modalTableDisplay">-</b></p>
                    <div class="table-responsive mb-3" style="max-height: 250px;">
                        <table class="table table-sm align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>ទំនិញ</th>
                                    <th>ចំនួន</th>
                                    <th>តម្លៃ</th>
                                    <th class="text-end">សរុប</th>
                                </tr>
                            </thead>
                            <tbody id="modalCartBody"></tbody>
                        </table>
                    </div>
                    <div class="d-flex justify-content-between align-items-center bg-light p-2 rounded-3 mb-2">
                        <span class="fw-bold">សរុបប្រាក់៖</span>
                        <h5 class="fw-bold text-success m-0" id="modalTotalDisplay">$0.00</h5>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">បោះបង់</button>
                    <button type="button" class="btn btn-success btn-sm fw-bold px-4" onclick="submitOrder()">ផ្ញើការកុម្ម៉ង់ (Submit)</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = window.location.origin;
        const API_URL = `${API_BASE}/api/accounting`;

        let masterItems = [];
        let customerCart = [];
        let tableParam = "ទូទៅ (Normal)";
        let orderModal;

        document.addEventListener("DOMContentLoaded", () => {
            orderModal = new bootstrap.Modal(document.getElementById('orderModal'));
            
            // ស្វែងរកលេខតុពី URL parameters ឧទាហរណ៍៖ menu.html?table=Table-1
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('table')) {
                tableParam = urlParams.get('table');
            }
            document.getElementById('tableBadge').innerText = tableParam;
            document.getElementById('tableNameDisplay').innerText = `តុ/បន្ទប់: ${tableParam}`;

            fetchMenuData();
        });

        async function fetchMenuData() {
            try {
                let res = await fetch(`${API_URL}/master-items`);
                let result = await res.json();
                if (result.success && result.data) {
                    masterItems = result.data.filter(i => (i.stock_quantity || 0) > 0);
                    populateCategories();
                    renderMenuItems();
                }
            } catch (err) {
                console.error("Error fetching menu:", err);
                document.getElementById('menuGrid').innerHTML = `<p class="text-center text-danger py-4">មិនអាចទាញយកបញ្ជីទំនិញបានទេ</p>`;
            }
        }

        function populateCategories() {
            let catSelect = document.getElementById('categorySelect');
            catSelect.innerHTML = '<option value="">-- គ្រប់ Category ទាំងអស់ --</option>';
            let categories = [...new Set(masterItems.map(i => i.category))];
            categories.forEach(c => {
                let opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                catSelect.appendChild(opt);
            });
        }

        function renderMenuItems() {
            let grid = document.getElementById('menuGrid');
            grid.innerHTML = '';
            let selectedCat = document.getElementById('categorySelect').value;

            let filtered = masterItems;
            if (selectedCat !== "") {
                filtered = masterItems.filter(i => i.category === selectedCat);
            }

            if (filtered.length === 0) {
                grid.innerHTML = `<p class="text-center text-muted py-4">គ្មានទំនិញក្នុង Category នេះទេ</p>`;
                return;
            }

            filtered.forEach(item => {
                let imgUrl = item.image_url || 'https://via.placeholder.com/150?text=No+Image';
                let price = parseFloat(item.retail_price || 0).toFixed(2);
                
                let col = document.createElement('div');
                col.className = 'col-6 col-md-4';
                col.innerHTML = `
                    <div class="item-card p-2 text-center h-100 d-flex flex-column justify-content-between">
                        <div>
                            <img src="${imgUrl}" class="rounded mb-2 w-100" alt="${item.item_name}">
                            <h6 class="fw-bold text-dark mb-1" style="font-size: 13px;">${item.item_name}</h6>
                            <span class="badge bg-light text-secondary border mb-2" style="font-size: 10px;">${item.category}</span>
                        </div>
                        <div>
                            <div class="fw-bold text-success mb-2" style="font-size: 14px;">$${price}</div>
                            <button class="btn btn-sm btn-outline-primary w-100 fw-bold rounded-3" onclick="addToCart('${item.id}')">
                                ➕ បន្ថែម (Add)
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(col);
            });
        }

        function addToCart(itemId) {
            let found = masterItems.find(i => i.id == itemId);
            if (!found) return;

            let cartIndex = customerCart.findIndex(i => i.item_id == found.id);
            if (cartIndex > -1) {
                customerCart[cartIndex].quantity += 1;
            } else {
                customerCart.push({
                    item_id: found.id,
                    category: found.category,
                    item_name: found.item_name,
                    unit: found.unit || 'ដុំ',
                    quantity: 1,
                    unit_price: parseFloat(found.retail_price || 0)
                });
            }
            updateCartDisplay();
        }

        function updateCartDisplay() {
            let total = 0;
            let count = 0;
            customerCart.forEach(i => {
                total += i.quantity * i.unit_price;
                count += i.quantity;
            });

            document.getElementById('cartTotalDisplay').innerText = `$${total.toFixed(2)}`;
            document.getElementById('cartCountDisplay').innerText = count;
        }

        function openOrderModal() {
            if (customerCart.length === 0) {
                alert("សូមជ្រើសរើសមុខទំនិញយ៉ាងហោចណាស់ ១ មុខសិន!");
                return;
            }

            document.getElementById('modalTableDisplay').innerText = tableParam;
            let tbody = document.getElementById('modalCartBody');
            tbody.innerHTML = '';
            let total = 0;

            customerCart.forEach((item, index) => {
                let subtotal = item.quantity * item.unit_price;
                total += subtotal;
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="fw-bold" style="font-size: 12px;">${item.item_name}</td>
                    <td>
                        <button class="btn btn-sm btn-light py-0 px-1 border" onclick="changeQty(${index}, -1)">-</button>
                        <span class="mx-1">${item.quantity}</span>
                        <button class="btn btn-sm btn-light py-0 px-1 border" onclick="changeQty(${index}, 1)">+</button>
                    </td>
                    <td style="font-size: 12px;">$${item.unit_price.toFixed(2)}</td>
                    <td class="text-end fw-bold text-success" style="font-size: 12px;">$${subtotal.toFixed(2)}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('modalTotalDisplay').innerText = `$${total.toFixed(2)}`;
            orderModal.show();
        }

        function changeQty(index, delta) {
            customerCart[index].quantity += delta;
            if (customerCart[index].quantity <= 0) {
                customerCart.splice(index, 1);
            }
            updateCartDisplay();
            if (customerCart.length > 0) {
                openOrderModal();
            } else {
                orderModal.hide();
            }
        }

       async function submitOrder() {
            if (customerCart.length === 0) return;

            // រៀបចំទិន្នន័យសម្រាប់ផ្ញើទៅកាន់ Endpoint ផ្ដល់សេវា QR Orders របស់ Server
            let orderData = {
                table_info: tableParam, // ឈ្មោះតុ ឬ Other
                items: customerCart
            };

            try {
                // ប្តូរមកហៅ API /api/customer-orders ដើម្បីឱ្យ Server ធ្វើការបង្កើត qr_orders និង Smart Merge ចូល Invoice តែមួយ
                let res = await fetch(`${API_BASE}/api/customer-orders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                let result = await res.json();

                if (res.ok && result.success) {
                    alert("✅ ការកុម្ម៉ង់ទំនិញរបស់អ្នកត្រូវបានផ្ញើទៅកាន់ POS ជោគជ័យ! សូមរង់ចាំអ្នកលក់ទទួលយក។");
                    customerCart = [];
                    updateCartDisplay();
                    orderModal.hide();
                } else {
                    alert(`❌ ${result.error || 'មានបញ្ហាក្នុងការផ្ញើការកុម្ម៉ង់!'}`);
                }
            } catch (err) {
                console.error("Error submitting order:", err);
                alert("❌ មានបញ្ហាក្នុងការភ្ជាប់ទៅកាន់ Server!");
            }
        }
    </script>
</body>
</html>
